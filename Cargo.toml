[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.dependencies]
mux-core = { path = "crates/core" }
mux-ui = { path = "crates/ui" }
mux-server = { path = "crates/server" }
egui = "0.37"
eframe = "0.37"
alacritty_terminal = "0.26"
png = "0.18"
egui_extras = { version = "0.37", default-features = false, features = ["file", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
base64 = "0.22"
syntect = { version = "5.3", default-features = false, features = ["regex-fancy", "parsing"] }
# bat's grammars, because syntect's own leave out typescript, toml and many more
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# checks that an update was signed by the release key before it's installed
ed25519-compact = { version = "2.6", default-features = false }
postcard = { version = "1.1", features = ["use-std"] }
portable-pty = "0.9"
libc = "0.2"
log = "0.4"
pulldown-cmark = { version = "0.13", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "process", "time"] }

# egui, syntect and the image decoders are many times slower unoptimised, so dependencies build optimised even in dev
[profile.dev.package."*"]
opt-level = 3

[profile.dev]
opt-level = 1

# releases trade a slower build for a smaller, faster app, since one codegen unit and whole-program lto let the
# compiler inline across every crate
[profile.release]
lto = "fat"
codegen-units = 1
