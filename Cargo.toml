[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
mux-core = { path = "crates/core" }
mux-ui = { path = "crates/ui" }
mux-server = { path = "crates/server" }
egui = "0.37"
eframe = "0.37"
alacritty_terminal = "0.26"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1.1", features = ["use-std"] }
portable-pty = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "process", "time"] }
