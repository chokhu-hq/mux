[package]
name = "mux-core"
version.workspace = true
edition.workspace = true

[dependencies]
serde.workspace = true
postcard.workspace = true
log.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

# windows' real version number and its current PATH, read from the system rather than from command output
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_System_SystemServices", "Win32_Foundation", "Win32_System_Registry", "Win32_System_SystemInformation"] }
