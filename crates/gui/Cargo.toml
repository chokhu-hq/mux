[package]
name = "mux-gui"
version.workspace = true
edition.workspace = true

[dependencies]
log.workspace = true
mux-core.workspace = true
mux-ui.workspace = true
mux-server.workspace = true
eframe.workspace = true
alacritty_terminal.workspace = true
rfd = "0.17"
serde.workspace = true
serde_json.workspace = true
ed25519-compact.workspace = true
raw-window-handle = "0.6"

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"

# the system's frosted background behind the window, acrylic on windows and vibrancy on macos
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
window-vibrancy = "0.8"

# tells windows the window is dark, which decides whether its acrylic is drawn light or dark
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
image.workspace = true
